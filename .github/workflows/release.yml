name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          body: |
            🚀 **Bisnor Cinema App - Release ${{ github.ref_name }}**
            - رابط کاربری مدرن متریال دیزاین ۳ با پشتیبانی از Dark / Light Mode
            - سیستم فیلترهای جامع (ژانر، امتیاز IMDb، سال ساخت، دوبله/زیرنویس)
            - پلیر حرفه‌ای با کنترل Gesture و اتصال به پلیرهای خارجی (VLC / MX Player)
            - طراحی بهینه‌شده برای تبلت، Samsung DeX و Android TV
            - سیستم بررسی خودکار بروزرسانی
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
